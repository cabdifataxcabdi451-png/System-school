<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Furqaan School System</title>
<meta name="app-version" content="1.0.1">
<style>
  :root{
    --primary:#1e3a5f;
    --primary-light:#2c5282;
    --accent:#d69e2e;
    --accent2:#38a169;
    --danger:#e53e3e;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1a202c;
    --muted:#718096;
    --border:#e2e8f0;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
  /* ===== LOGIN ===== */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 60%,var(--accent) 140%);
    padding:20px;
  }
  .login-box{
    background:var(--card);width:100%;max-width:420px;border-radius:var(--radius);
    padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .login-logo{
    width:64px;height:64px;border-radius:50%;background:var(--primary);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    color:#fff;font-size:28px;font-weight:bold;
  }
  .login-box h1{text-align:center;font-size:22px;color:var(--primary);margin-bottom:4px;}
  .login-box p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
  .role-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg);padding:5px;border-radius:10px;}
  .role-tab{
    flex:1;text-align:center;padding:9px 4px;border-radius:8px;font-size:12.5px;
    cursor:pointer;color:var(--muted);font-weight:600;transition:.2s;
  }
  .role-tab.active{background:var(--primary);color:#fff;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .field input,.field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:14px;outline:none;transition:.2s;
  }
  .field input:focus,.field select:focus{border-color:var(--primary-light);}
  .btn{
    width:100%;padding:12px;border:none;border-radius:8px;background:var(--primary);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .btn:hover{background:var(--primary-light);}
  .btn.small{width:auto;padding:8px 16px;font-size:13px;}
  .btn.accent{background:var(--accent2);}
  .btn.danger{background:var(--danger);}
  .btn.outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .login-error{
    background:#fed7d7;color:#c53030;padding:10px;border-radius:8px;font-size:13px;
    margin-bottom:14px;display:none;
  }
  .login-hint{
    margin-top:18px;background:#ebf8ff;padding:10px 12px;border-radius:8px;
    font-size:11.5px;color:#2c5282;line-height:1.6;
  }
  /* ===== APP SHELL ===== */
  #app{display:none;min-height:100vh;}
  .topbar{
    background:var(--primary);color:#fff;padding:14px 22px;display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;}
  .badge-role{background:var(--accent);color:#1a202c;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .lang-toggle{
    background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);color:#fff;
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .lang-toggle:hover{background:rgba(255,255,255,.28);}
  .greeting-banner{
    display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--primary),var(--primary-light));
    color:#fff;padding:18px 22px;border-radius:var(--radius);margin-bottom:20px;
  }
  .greeting-icon{font-size:34px;}
  .greeting-main{font-size:17px;font-weight:800;}
  .greeting-sub{font-size:12.5px;opacity:.85;margin-top:2px;}
  .update-banner{
    position:fixed;top:0;left:0;right:0;z-index:300;
    background:linear-gradient(90deg,#d69e2e,#dd6b20);color:#1a202c;
    padding:12px 20px;display:none;align-items:center;justify-content:center;gap:16px;
    font-size:13.5px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.2);
    animation:slideDown .4s ease;
  }
  .update-banner.show{display:flex;}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
  .update-banner button{
    background:#1a202c;color:#fff;border:none;padding:7px 16px;border-radius:20px;
    font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .update-banner button:hover{background:#2d3748;}
  .update-banner .dismiss{background:transparent;color:#1a202c;text-decoration:underline;padding:7px 8px;}
  .layout{display:flex;}
  .sidebar{
    width:220px;background:#fff;min-height:calc(100vh - 58px);border-right:1px solid var(--border);
    padding:16px 10px;
  }
  .nav-item{
    padding:11px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
    color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:10px;transition:.15s;
  }
  .nav-item:hover{background:var(--bg);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;}
  .main{flex:1;padding:24px;max-width:1200px;}
  .page{display:none;animation:fadeUp .3s ease;}
  .page.active{display:block;}
  .page-title{font-size:22px;font-weight:800;color:var(--primary);margin-bottom:4px;}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--border);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-head h3{font-size:16px;color:var(--text);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;padding:10px;background:var(--bg);color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:hover td{background:#fafcff;}
  .tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.green{background:#c6f6d5;color:#276749;}
  .tag.red{background:#fed7d7;color:#c53030;}
  .tag.yellow{background:#fefcbf;color:#975a16;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px;}
  .icon-btn:hover{background:var(--bg);}
  .search-input{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;width:220px;}
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);padding:26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:17px;color:var(--primary);margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1a202c;color:#fff;padding:12px 22px;border-radius:8px;font-size:13.5px;
    z-index:200;display:none;box-shadow:0 8px 20px rgba(0,0,0,.3);
  }
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .quick-card{
    background:var(--bg);border-radius:10px;padding:16px 10px;text-align:center;cursor:pointer;
    border:1px solid var(--border);border-top:3px solid var(--qc);transition:.2s;
  }
  .quick-card:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(0,0,0,.08);background:#fff;}
  .quick-icon{font-size:24px;margin-bottom:6px;}
  .quick-num{font-size:19px;font-weight:800;color:var(--text);}
  .quick-lbl{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;}
  .bar-track{height:10px;background:var(--bg);border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),#68d391);border-radius:20px;transition:.4s;}
  @media(max-width:768px){
    .cards-row[style*="1.3fr"]{grid-template-columns:1fr !important;}
  }
  .avatar-circle{
    width:34px;height:34px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#1a202c;
  }
  @media(max-width:768px){
    .sidebar{position:fixed;left:-220px;top:58px;z-index:60;transition:.3s;background:#fff;}
    .sidebar.open{left:0;}
    .main{padding:14px;}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>

<div class="update-banner" id="updateBanner">

</div>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo" id="loginLogo">🎓</div>
    <h1 id="loginSchoolName">Al-Furqaan School</h1>
    <p class="sub">Nidaamka Maamulka Dugsiga</p>
    <div class="role-tabs" id="roleTabs">
      <div class="role-tab active" data-role="admin">Admin</div>
      <div class="role-tab" data-role="teacher">Macalin</div>
      <div class="role-tab" data-role="student">Arday</div>
      <div class="role-tab" data-role="parent">Waalid</div>
    </div>
    <div class="login-error" id="loginError">Username ama password waa khalad.</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Geli username-kaaga" autocomplete="off" name="alfurqaan_user_field" readonly onfocus="this.removeAttribute('readonly')">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Geli password-kaaga" autocomplete="new-password" name="alfurqaan_pass_field" readonly onfocus="this.removeAttribute('readonly')">
    </div>
    <button class="btn" onclick="doLogin()">Gal (Login)</button>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left" id="topbarSchoolName">🎓 Al-Furqaan School</div>
    <div class="topbar-right">
      <span class="badge-role" id="curRoleBadge"></span>
      <button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button>
      <div class="avatar-circle" id="curAvatar">A</div>
      <span id="curName"></span>
      <button class="btn small outline" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Ka bax</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

function loadDB(){
  let raw = localStorage.getItem(DB_KEY);
  if(!raw){

    localStorage.setItem(DB_KEY, JSON.stringify(seed));
    return seed;

  const parsed = JSON.parse(raw);
  // Migration: hubi in settings uu jiro fayllada hore loo kaydiyay
  if(!parsed.settings){
    parsed.settings = seedData().settings;
    localStorage.setItem(DB_KEY, JSON.stringify(parsed));
  }
  return parsed;
}

/* ==================================================
   AUTO-UPDATE CHECKER
   Marka aad file-ka GitHub-ka ku beddesho, kor u qaad
   version-ka <meta name="app-version"> ee <head>, tusaale:
   1.0.0 -> 1.0.1. Browser-ka fadhiya wuxuu si toos ah u
   ogaanayaa isbeddelka oo tusi doona banner-ka "Nooc Cusub".
================================================== */
const CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;
let updateDismissed = false;

async function checkForUpdate(){
  if(updateDismissed) return;
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const html = await res.text();
    const match = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
    if(match && match[1] !== CURRENT_VERSION){
      document.getElementById('updateBanner').classList.add('show');
    }
  } catch(e){ /* offline or blocked - ignore silently */ }
}
function dismissUpdate(){
  updateDismissed = true;
  document.getElementById('updateBanner').classList.remove('show');
}
// Hubi marka bogga la furo, dabadeed hal mar 90 sekan kasta
checkForUpdate();
setInterval(checkForUpdate, 90000);
// Hubi marka user-ku ku soo laabto tab-ka (ka yimid tab kale)
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') checkForUpdate();
});

function getGreeting(){
  const hour = new Date().getHours();
  let so, en, icon;
  if(hour>=5 && hour<12){ so='Subax wanaagsan'; en='Good morning'; icon='🌅'; }
  else if(hour>=12 && hour<15){ so='Duhur wanaagsan'; en='Good afternoon'; icon='☀️'; }
  else if(hour>=15 && hour<19){ so='Galab wanaagsan'; en='Good evening'; icon='🌇'; }
  else { so='Habeen wanaagsan'; en='Good night'; icon='🌙'; }
  return {so, en, icon};
}
function greetingBanner(){
  const g = getGreeting();
  const now = new Date();
  const timeStr = now.toLocaleTimeString(LANG==='so'?'so':'en-US', {hour:'2-digit', minute:'2-digit'});
  return `
  <div class="greeting-banner">
    <div class="greeting-icon">${g.icon}</div>
    <div>
      <div class="greeting-main">${g.so}, ${CURRENT_USER.name}!</div>
      <div class="greeting-sub">${g.en}, ${CURRENT_USER.name} · ${timeStr}</div>
    </div>
  </div>`;
}

function openStudentForm(id){

        </select>
      </div>

function saveStudent(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Fadlan geli magaca'); return; }
  const data = {
    name, classId: document.getElementById('f_class').value,
    gender: document.getElementById('f_gender').value,
    phone: document.getElementById('f_phone').value,
    parentId: document.getElementById('f_parent').value
  };
  if(id){
    Object.assign(DB.students.find(x=>x.id===id), data);
  } else {
    DB.students.push({id: uid('s'), ...data});
  }
  saveDB(); closeModal(); renderPage('students'); showToast('La kaydiyay ✅');
}
function deleteStudent(id){
  if(!confirm('Ma hubtaa inaad tirtirto ardaygan?')) return;
  DB.students = DB.students.filter(x=>x.id!==id);
  saveDB(); renderPage('students'); showToast('La tirtiray');
}

================================================== */
function openBulkStudentForm(){
  openModal(`
    <h3>📋 Ku dar Liis Ardayda (Bulk)</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px">
      Ku qor magac kasta xariiq gooni ah (hal magac hal line). Waxaad ku dari kartaa
      ilaa boqolaal magac hal mar.
    </p>
    <div class="field">
      <label>Fasalka ay wada galayaan</label>
      <select id="bulk_class">${DB.classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>Jinsiga guud (waad bedeli kartaa gudaha shaxda kadib)</label>
      <select id="bulk_gender"><option>Lab</option><option>Dhedig</option></select>
    </div>
    <div class="field">
      <label>Magacyada Ardayda (hal magac hal xariiq)</label>
      <textarea id="bulk_names" rows="10" style="width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit"
        placeholder="Xamse Cali Warsame&#10;Hodan Aadan Yusuf&#10;Yusuf Maxamed Nuur&#10;..."></textarea>
    </div>
    <div id="bulkPreviewCount" style="font-size:12.5px;color:var(--muted);margin-bottom:10px"></div>
    <div style="display:flex;gap:10px">
      <button class="btn accent" onclick="saveBulkStudents()">Kaydi Dhammaan</button>
      <button class="btn outline" onclick="closeModal()">Jooji</button>
    </div>
  `);
  document.getElementById('bulk_names').addEventListener('input', ()=>{
    const lines = document.getElementById('bulk_names').value.split('\n').map(l=>l.trim()).filter(Boolean);
    document.getElementById('bulkPreviewCount').textContent = `${lines.length} magac ayaa la aqriyay`;
  });
}
function saveBulkStudents(){
  const classId = document.getElementById('bulk_class').value;
  const gender = document.getElementById('bulk_gender').value;
  const raw = document.getElementById('bulk_names').value;
  const names = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(names.length === 0){ showToast('Fadlan geli ugu yaraan hal magac'); return; }
  names.forEach(name=>{
    DB.students.push({
      id: uid('s'), name, classId, gender, phone:'', parentId: DB.parents[0]?.id || ''
    });
  });
  saveDB(); closeModal(); renderPage('students');
  showToast(`✅ ${names.length} arday ayaa lagu daray database-ka`);
}
function filterStudentTable(){
  const q = document.getElementById('studentSearchBox').value.trim().toLowerCase();
  const filtered = q ? DB.students.filter(s=> s.name.toLowerCase().includes(q)) : DB.students;
  document.getElementById('studentTableBody').innerHTML = filtered.map(s=>`
      <tr>
        <td>${s.name}</td><td>${className(s.classId)}</td><td>${s.gender}</td>
        <td>${s.phone}</td><td>${parentName(s.parentId)}</td>
        <td>
          <button class="icon-btn" onclick="openStudentForm('${s.id}')">✏️</button>
          <button class="icon-btn" onclick="deleteStudent('${s.id}')">🗑️</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty-state">Wax lama helin</td></tr>`;
}

let PENDING_LOGO_IMAGE = undefined; // undefined = ma beddelin, null = la saaray, string = sawir cusub

function previewLogoUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 1024*1024){
    showToast('❌ Sawirka waa inuu ka yaraado 1MB');
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    PENDING_LOGO_IMAGE = e.target.result;
    document.getElementById('logoPreview').innerHTML = `<img src="${PENDING_LOGO_IMAGE}" style="width:100%;height:100%;object-fit:cover">`;
    showToast('Sawirka waa la doortay — dhagsii "Kaydi Settings-ka" si aad u xaqiijiso');
  };
  reader.readAsDataURL(file);
}
function removeLogoImage(){
  PENDING_LOGO_IMAGE = null;
  document.getElementById('logoPreview').innerHTML = document.getElementById('st_logo').value || '🎓';
  showToast('Sawirka waa la saaray — dhagsii "Kaydi Settings-ka" si aad u xaqiijiso');
}
function saveSettings(){
  const newSettings = {
    schoolName: document.getElementById('st_name').value.trim() || 'Al-Furqaan School',
    schoolLogo: document.getElementById('st_logo').value.trim() || '🎓',
    address: document.getElementById('st_address').value.trim(),
    phone: document.getElementById('st_phone').value.trim(),
    email: document.getElementById('st_email').value.trim(),
    currency: document.getElementById('st_currency').value.trim() || '$',
    feeAmount: Number(document.getElementById('st_feeAmount').value) || 0
  };
  if(PENDING_LOGO_IMAGE === null){
    // sawirka waa la saaray
  } else if(PENDING_LOGO_IMAGE){
    newSettings.schoolLogoImage = PENDING_LOGO_IMAGE;
  } else if(DB.settings && DB.settings.schoolLogoImage){
    newSettings.schoolLogoImage = DB.settings.schoolLogoImage;
  }
  DB.settings = newSettings;
  PENDING_LOGO_IMAGE = undefined;
  saveDB();
  applyBranding();
  showToast('Settings-ka waa la kaydiyay ✅');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `${(DB.settings?.schoolName||'school').replace(/\s+/g,'_')}_backup_${dateStr}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup-ka waa la soo dejiyay ✅');
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!confirm('Import-kan wuxuu ku beddelayaa xogta hadda jirta ee nidaamka. Ma hubtaa inaad sii wado?')){
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.users || !Array.isArray(imported.users)){
        showToast('❌ Faylka backup-ka sax ma aha');
        return;
      }
      if(!imported.settings) imported.settings = seedData().settings;
      DB = imported;
      saveDB();
      applyBranding();
      buildSidebar();
      navigate('settings');
      showToast('Xogta waa la soo galiyay si guul leh ✅');
    } catch(err){
      showToast('❌ Faylka lama akhriyi karo');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}
function changeMyLogin(){
  const current = document.getElementById('mp_current').value;
  const newUsername = document.getElementById('mp_username').value.trim();
  const newPass = document.getElementById('mp_new').value;
  const confirmPass = document.getElementById('mp_confirm').value;

  if(current !== CURRENT_USER.password){
    showToast('❌ Password-ka hadda jira waa khalad');
    return;
  }
  if(!newUsername){
    showToast('❌ Username-ka ma bannaanaan karo');
    return;
  }
  const clash = DB.users.find(u => u.username === newUsername && u.id !== CURRENT_USER.id);
  if(clash){
    showToast('❌ Username-kan horeba waa la isticmaalayaa');
    return;
  }
  if(newPass || confirmPass){
    if(newPass.length < 4){
      showToast('❌ Password-ka cusub waa inuu ka badan yahay 3 xaraf');
      return;
    }
    if(newPass !== confirmPass){
      showToast('❌ Password-yada cusub isma waafaqsana');
      return;
    }
  }

  const user = DB.users.find(u => u.id === CURRENT_USER.id);
  user.username = newUsername;
  if(newPass) user.password = newPass;
  CURRENT_USER = user;
  saveDB();

  document.getElementById('mp_current').value = '';
  document.getElementById('mp_new').value = '';
  document.getElementById('mp_confirm').value = '';
  showToast('✅ Login-kaaga waa la beddelay');
}
function resetSettingsOnly(){
  if(!confirm('Ma hubtaa inaad dib-u-dejinayso settings-ka dugsiga asalka ah?')) return;
  DB.settings = seedData().settings;
  saveDB();
  applyBranding();
  renderPage('settings');
  showToast('Settings-ka waa la dib-u-dejiyay');
}
function resetSystem(){
  if(!confirm('DIGNIIN: Tan waxay tirtirtaa dhammaan xogta (ardayda, macalimiinta, users, iwm) oo waxay ku beddeshaa xogta bilowga ah. Ficilkan lama celin karo. Ma hubtaa?')) return;
  if(!confirm('Xaqiijinta labaad: Run ahaantii ma rabtaa in xogta oo dhan la tirtiro?')) return;
  DB = seedData();
  saveDB();
  applyBranding();
  buildSidebar();
  navigate('dashboard');
  showToast('Nidaamka waa la dib-u-deji dhammaystiray');
}

  const avg = myGrades.length ? Math.round(myGrades.reduce((a,g)=>a+g.score,0)/myGrades.length) : 0;
  return `
  <div class="page-title">Dashboard-kayga</div>
  <div class="page-sub">${className(s?.classId)}</div>
  ${greetingBanner()}
  <div class="cards-row">
    <div class="stat-card"><div class="num">${avg}%</div><div class="lbl">Celceliska Dhibcaha</div></div>
    <div class="stat-card"><div class="num">${DB.attendance.filter(a=>a.studentId===myStudentId()&&a.status==='Xaadir').length}</div><div class="lbl">Maalmaha Xaadirka</div></div>
  </div>
  <div class="panel"><h3 style="margin-bottom:12px">📢 Ogeysiisyada</h3>
  ${DB.announcements.slice(-3).reverse().map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><b>${a.title}</b><div style="color:var(--muted);font-size:13px">${a.body}</div></div>`).join('') || '<div class="empty-state">Ma jiro</div>'}
  </div>`;
}
function renderStudentGrades(){
  const myGrades = DB.grades.filter(g=>g.studentId===myStudentId());
  return `<div class="page-title">Dhigistayda</div>
  <div class="panel"><table><thead><tr><th>Maadada</th><th>Semester</th><th>Dhibcaha</th></tr></thead>
  <tbody>${myGrades.map(g=>`<tr><td>${g.subject}</td><td>${g.term}</td><td><span class="tag ${g.score>=50?'green':'red'}">${g.score}%</span></td></tr>`).join('') || '<tr><td colspan="3" class="empty-state">Dhigis lama gelin</td></tr>'}</tbody></table></div>`;
}
function renderStudentAttendance(){
  const myAtt = DB.attendance.filter(a=>a.studentId===myStudentId());
  return `<div class="page-title">Xaadirintayda</div>
  <div class="panel"><table><thead><tr><th>Taariikh</th><th>Xaalada</th></tr></thead>
  <tbody>${myAtt.slice().reverse().map(a=>`<tr><td>${a.date}</td><td><span class="tag ${a.status==='Xaadir'?'green':'red'}">${a.status}</span></td></tr>`).join('') || '<tr><td colspan="2" class="empty-state">Lama gelin</td></tr>'}</tbody></table></div>`;
}
function renderStudentFees(){
  const myFees = DB.fees.filter(f=>f.studentId===myStudentId());
  return `<div class="page-title">Lacagtayda</div>
  <div class="panel"><table><thead><tr><th>Qiimaha</th><th>La bixiyay</th><th>Xaalada</th><th>Taariikh</th></tr></thead>
  <tbody>${myFees.map(f=>`<tr><td>$${f.amount}</td><td>$${f.paid}</td><td><span class="tag ${f.status==='La bixiyay'?'green':f.status==='Qeyb ahaan'?'yellow':'red'}">${f.status}</span></td><td>${f.date}</td></tr>`).join('') || '<tr><td colspan="4" class="empty-state">Lama gelin</td></tr>'}</tbody></table></div>`;
}
